<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GP 360 - Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#0086FF;--primary:#006194;--bg:#f8fafc;--card:#fff;--line:#e2e8f0;--text:#0f172a;--muted:#64748b;--soft:#f1f5f9;
  --good:#047857;--good-bg:#ecfdf5;--bad:#b91c1c;--bad-bg:#fef2f2;--warn:#92400e;--warn-bg:#fffbeb;--info:#075985;--info-bg:#f0f9ff}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.45 Inter,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--text);background:var(--bg)}
button,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.bar{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.logo{width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,134,255,.3)}
.brand{display:flex;gap:10px;align-items:center}.brand b{font-size:15px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
nav{display:flex;gap:4px;overflow-x:auto;order:3;width:100%}
@media(min-width:900px){nav{order:0;width:auto;margin-left:12px}}
nav a{padding:7px 12px;border-radius:8px;color:#475569;text-decoration:none;font-weight:500;font-size:13px;white-space:nowrap}
nav a:hover{background:var(--soft)}nav a.on{background:#e0f2fe;color:var(--primary);font-weight:700}
.user{margin-left:auto;text-align:right;line-height:1.2}.user b{font-size:12px}.user small{display:block;color:var(--muted);font-size:11px}
main{max-width:1280px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 2px;letter-spacing:-.01em}h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--info-bg);color:var(--info);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600}
.btn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-weight:600}.btn:hover{background:var(--soft)}
.grid{display:grid;gap:12px}.g-ind{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.g-grp{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.k-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.k-val{font-size:28px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin:2px 0}
.k-val small{font-size:13px;font-weight:600;color:var(--muted);margin-left:3px}
.delta{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;border-radius:6px;padding:1px 7px}
.good{background:var(--good-bg);color:var(--good)}.bad{background:var(--bad-bg);color:var(--bad)}.flat{background:var(--soft);color:var(--muted)}
.sub{color:var(--muted);font-size:12px;margin-top:4px}
section{margin-bottom:26px}
.grp-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.grp-h b{font-size:14px}.grp-h a{font-size:12px;color:var(--primary);font-weight:600;text-decoration:none}.grp-h a:hover{text-decoration:underline}
.nums{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}.nums div b{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.nums div span{font-size:12px;color:var(--muted)}
.nums .alert b{color:var(--bad)}
.dist{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.dist span{background:var(--soft);border-radius:6px;padding:1px 8px;font-size:12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--soft);position:sticky;top:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}.tw table{margin:0}tr:last-child td{border-bottom:0}
.empty{padding:22px;text-align:center;color:var(--muted)}
.err{max-width:560px;margin:40px auto;text-align:center}.err .ic{width:46px;height:46px;border-radius:50%;background:var(--bad-bg);color:var(--bad);display:grid;place-items:center;margin:0 auto 10px;font-weight:700;font-size:20px}
.skel{background:linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 37%,#f1f5f9 63%);background-size:400% 100%;animation:sh 1.3s ease infinite;border-radius:8px;min-height:84px}
@keyframes sh{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.mot{margin-bottom:11px}.mot-h{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:4px}.mot-h b{font-variant-numeric:tabular-nums;white-space:nowrap}.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--primary);border-radius:99px}
.busy{opacity:.45;pointer-events:none;transition:opacity .15s}.filt{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:18px}.filt label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;display:flex;flex-direction:column;gap:3px}.filt select{min-width:170px;max-width:260px}.lnk{background:none;border:0;color:var(--primary);font-weight:600;padding:6px 4px}.lnk:hover{text-decoration:underline}
.card.alertc{border-color:#fecaca;background:#fffafa}.neg{color:var(--bad);font-weight:700}.pos{color:var(--good);font-weight:600}
.ctls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}.ctls input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:220px;font:inherit}
th.s{cursor:pointer;user-select:none}th.s:hover{background:#e2e8f0}th.s.asc::after{content:' ▲';color:var(--primary)}th.s.desc::after{content:' ▼';color:var(--primary)}
.more{text-align:center;padding:10px}th.l,td.l{text-align:left}.sm{font-size:12px;color:var(--muted)}
.note{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand"><div class="logo">GP</div><div><b>GP 360</b><small>Magalu • Gestão de Pessoas</small></div></div>
  <nav id="nav" aria-label="Páginas"></nav>
  <div class="user"><b id="uNome">—</b><small id="uPerfil"></small></div>
</div></header>
<main id="main"><div class="grid g-ind"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div></main>

<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (n, d) => n === null || n === undefined ? '—' : Number(n).toLocaleString('pt-BR', { minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 0 : d });
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fmtMes = m => { const p = String(m).split('-'); return p.length === 2 ? `${MESES[+p[1] - 1] || p[1]}/${p[0]}` : m; };
const hasGAS = () => typeof google !== 'undefined' && google.script && google.script.run;
const call = (fn, ...a) => new Promise((ok, no) => { if (!hasGAS()) return no(new Error('Abra o portal pela URL do web app.')); google.script.run.withSuccessHandler(r => { try { ok(JSON.parse(r)); } catch (e) { no(e); } }).withFailureHandler(no)[fn](...a); });

/* telemetria em lote */
const TQ = []; let PAG = 'visaoGeral';
function track(a, d) { TQ.push({ t: Date.now(), p: PAG, a: a, d: d || '-' }); if (TQ.length >= 30) flush(); }
function flush() { if (!TQ.length || !hasGAS()) return; const l = TQ.splice(0, TQ.length); try { google.script.run.withFailureHandler(function () {}).registrarEventos(l); } catch (e) {} }
setInterval(flush, 15000); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); }); addEventListener('pagehide', flush);

const S = { ctx: null, comp: null, R: null, filtros: { diretoria: '', regional: '', coordenador: '' }, fil: { q: '', k: 'filial_id', asc: true, lim: 100 } };

function erro(titulo, msg) { $('main').innerHTML = `<div class="card err"><div class="ic">!</div><h1>${esc(titulo)}</h1><p style="color:var(--muted)">${esc(msg)}</p><button class="btn" id="retry">Tentar novamente</button></div>`; $('retry').onclick = () => boot(); }
function skeleton() { $('main').innerHTML = '<div class="grid g-ind"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>'; }

/* ---------- navegação ---------- */
function montarNav() {
  $('nav').innerHTML = S.ctx.paginas.map(p => `<a href="#${esc(p.id)}" data-p="${esc(p.id)}">${esc(p.titulo)}</a>`).join('');
  $('uNome').textContent = S.ctx.nome; $('uPerfil').textContent = ({ ADMIN: 'Administrador', DIRETOR_RH: 'Diretor RH', GERENTE_RH: 'Gerente RH', COORDENADOR: 'Coordenador', COMPLIANCE: 'Compliance' })[S.ctx.perfil] || S.ctx.perfil;
}
function pagina() { const h = (location.hash || '').replace('#', ''); return S.ctx.paginas.some(p => p.id === h) ? h : S.ctx.paginas[0].id; }
function rota() {
  PAG = pagina(); document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.p === PAG)); track('abrir');
  if (PAG === 'visaoGeral') carregarVisao(S.comp); else carregarGenerica(PAG);
}
addEventListener('hashchange', () => { if (S.ctx) rota(); });

/* ---------- VISÃO GERAL ---------- */
// Os indicadores são VALORES FINAIS lançados na base (nada é calculado aqui). bom = 'alto' (subir é bom) | 'baixo' (descer é bom)
function delta(atual, ant, bom, casas, unidade) {
  if (atual === null || atual === undefined || ant === null || ant === undefined) return '<span class="delta flat">sem mês anterior</span>';
  const d = Math.round((atual - ant) * Math.pow(10, casas)) / Math.pow(10, casas);
  if (d === 0) return '<span class="delta flat">= igual ao mês anterior</span>';
  const cls = (d > 0) === (bom === 'alto') ? 'good' : 'bad';
  return `<span class="delta ${cls}">${d > 0 ? '▲' : '▼'} ${d > 0 ? '+' : ''}${nf(d, casas)}${unidade || ''} vs. mês anterior</span>`;
}
function cardInd(label, val, unid, dl, sub, cls) { return `<div class="card ${cls || ''}"><div class="k-label">${esc(label)}</div><div class="k-val">${val}<small>${esc(unid || '')}</small></div>${dl || ''}<div class="sub">${sub || ''}</div></div>`; }
const gapTxt = (g, cota) => g === null || g === undefined ? 'sem dado' : g < 0 ? `faltam ${nf(-g)} para a cota` : g === 0 ? 'cota atendida' : `${nf(g)} acima da cota`;
const gapCls = g => g === null || g === undefined ? '' : g < 0 ? 'neg' : g > 0 ? 'pos' : '';

function cardsDe(b, rotulo, mesTxt) {
  const a = b && b.atual, p = (b && b.anterior) || {};
  if (!a) return `<div class="card empty">Indicadores de ${esc(rotulo)} ainda não lançados para ${esc(mesTxt)}.</div>`;
  const g = a.pcd_gap;
  return '<div class="grid g-ind">' +
    cardInd('Vendas (% da meta)', nf(a.vendas_pct, 1), '%', delta(a.vendas_pct, p.vendas_pct, 'alto', 1, ' pp'), esc(rotulo)) +
    cardInd('NPS', nf(a.nps, 1), '', delta(a.nps, p.nps, 'alto', 1, ''), esc(rotulo)) +
    cardInd('Taxa de desligamento', nf(a.tx_deslig_pct, 1), '%', delta(a.tx_deslig_pct, p.tx_deslig_pct, 'baixo', 1, ' pp'), esc(rotulo)) +
    cardInd('Banco de horas', nf(a.bh_horas, 1), 'h', delta(a.bh_horas, p.bh_horas, 'baixo', 1, ' h'), esc(rotulo)) +
    cardInd('Coleta de lixo', nf(a.coleta_lixo), '', p.coleta_lixo === null || p.coleta_lixo === undefined ? '<span class="delta flat">sem mês anterior</span>' : `<span class="delta flat">mês anterior: ${nf(p.coleta_lixo)}</span>`, esc(rotulo)) +
    cardInd('Gap de PCD', `<span class="${gapCls(g)}">${nf(g)}</span>`, '', delta(g, p.pcd_gap, 'alto', 0, ''), `${gapTxt(g)} · cota: ${nf(a.pcd_cota)}`, g < 0 ? 'alertc' : '') + '</div>';
}

function tabelaRegionais(I) {
  const v = (x, k, d) => x.atual ? nf(x.atual[k], d) : '—';
  return tabela([['Regional', x => esc(x.regional)], ['Vendas %', x => v(x, 'vendas_pct', 1)], ['NPS', x => v(x, 'nps', 1)], ['Desl. %', x => v(x, 'tx_deslig_pct', 1)], ['BH (h)', x => v(x, 'bh_horas', 1)], ['Coleta', x => v(x, 'coleta_lixo')], ['Cota PCD', x => v(x, 'pcd_cota')],
    ['Gap PCD', x => x.atual ? `<span class="${gapCls(x.atual.pcd_gap)}">${nf(x.atual.pcd_gap)}</span>` : '—']], I.regionais, 'Sem regionais.');
}

function blocoIndicadores(R, mesTxt) {
  const I = R.indicadores; if (!I) return '';
  let h = '';
  if (I.rede) h += cardsDe(I.rede, 'Rede (total)', mesTxt) + (I.regionais.length > 1 ? `<h2 style="margin:20px 0 10px">Por regional</h2>${tabelaRegionais(I)}` : '');
  else if (I.regionais.length === 1) h += cardsDe(I.regionais[0], I.regionais[0].regional, mesTxt);
  else if (I.regionais.length > 1) h += tabelaRegionais(I);
  else h += '<div class="card empty">Nenhuma regional para os filtros escolhidos.</div>';
  if (I.filiaisSemIndicador > 0 && R.escopo.filiais > 0) h += `<div class="note" style="margin-top:12px">${nf(I.filiaisSemIndicador)} filial(is) deste recorte ainda sem indicador lançado em ${esc(mesTxt)}.</div>`;
  return h;
}

/* tabela por filial: busca + ordenação + "mostrar mais" */
const FCOLS = [['filial_id', 'Filial', f => f.filial_id, 0], ['nome', 'Loja', f => f.nome, 0], ['regional', 'Regional', f => f.regional, 0], ['vendas_pct', 'Vendas %', f => f.atual.vendas_pct, 1], ['nps', 'NPS', f => f.atual.nps, 1],
  ['tx_deslig_pct', 'Desl. %', f => f.atual.tx_deslig_pct, 1], ['bh_horas', 'BH (h)', f => f.atual.bh_horas, 1], ['coleta_lixo', 'Coleta', f => f.atual.coleta_lixo, 0], ['pcd_cota', 'Cota PCD', f => f.atual.pcd_cota, 0], ['pcd_gap', 'Gap PCD', f => f.atual.pcd_gap, 0]];
function linhasFiliais(R) {
  const I = R.indicadores; let l = I.porFilial;
  const q = S.fil.q.trim().toLowerCase(); if (q) l = l.filter(f => `${f.filial_id} ${f.nome} ${f.regional}`.toLowerCase().includes(q));
  const c = FCOLS.find(x => x[0] === S.fil.k) || FCOLS[0], dir = S.fil.asc ? 1 : -1, col = new Intl.Collator('pt-BR', { numeric: true });
  return l.slice().sort((a, b) => { const x = c[2](a), y = c[2](b); if (x === y) return 0; if (x === null || x === undefined) return 1; if (y === null || y === undefined) return -1; return (typeof x === 'number' ? x - y : col.compare(String(x), String(y))) * dir; });
}
function renderFiliais() {
  const R = S.R, box = $('tblFil'); if (!box || !R) return;
  const l = linhasFiliais(R), lim = S.fil.lim, ver = l.slice(0, lim);
  $('filCount').textContent = `${nf(l.length)} filial(is)`;
  if (!ver.length) { box.innerHTML = '<div class="card empty">Nenhuma filial encontrada.</div>'; return; }
  const th = FCOLS.map(c => `<th class="s ${c[0] === 'nome' || c[0] === 'regional' ? 'l ' : ''}${S.fil.k === c[0] ? (S.fil.asc ? 'asc' : 'desc') : ''}" data-k="${c[0]}">${esc(c[1])}</th>`).join('');
  const tr = ver.map(f => '<tr>' + FCOLS.map(c => { const v = c[2](f); if (c[0] === 'pcd_gap') return `<td class="${gapCls(v)}">${nf(v)}</td>`; return `<td${c[0] === 'nome' || c[0] === 'regional' ? ' class="l"' : ''}>${typeof v === 'number' ? nf(v, c[3]) : esc(v === null || v === undefined ? '—' : v)}</td>`; }).join('') + '</tr>').join('');
  box.innerHTML = `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>` + (l.length > lim ? `<div class="more"><button class="btn" id="mais">Mostrar mais (${nf(Math.min(100, l.length - lim))} de ${nf(l.length - lim)} restantes)</button></div>` : '');
}

function nums(pares) { return '<div class="nums">' + pares.map(x => `<div class="${x[2] ? 'alert' : ''}"><b>${nf(x[1], x[3])}</b><span>${esc(x[0])}</span></div>`).join('') + '</div>'; }
function grupo(titulo, pagina, corpo) { const link = pagina && S.ctx.paginas.some(p => p.id === pagina) ? `<a href="#${pagina}">Ver detalhe →</a>` : ''; return `<div class="card"><div class="grp-h"><b>${esc(titulo)}</b>${link}</div>${corpo}</div>`; }

function blocoTrabalho(t) {
  const g = [];
  if (t.campo) { const c = t.campo; g.push(grupo('Campo (visitas e ações)', 'mural', nums([['ações lançadas', c.acoes], ['visitas presenciais', c.visitas], ['filiais visitadas', c.filiais_visitadas], ['pessoas impactadas', c.pessoas_impactadas], ['horas', c.horas, 0, 1], ['km rodados', c.km, 0, 0], ['validações pendentes', c.validacao_pendente, c.validacao_pendente > 0]]))); }
  if (t.social) { const s = t.social; g.push(grupo('Social', 'social', nums([['casos novos no mês', s.novos], ['casos abertos', s.abertos], ['encerrados no mês', s.encerrados]]))); }
  if (t.apuracoes) { const a = t.apuracoes; g.push(grupo('Apurações', 'apuracoes', nums([['novas no mês', a.novas], ['em aberto', a.em_aberto], ['em comitê', a.em_comite], ['concluídas no mês', a.concluidas], ['retornos SLA pendentes', a.sla_pendentes], ['SLA atrasados', a.sla_atrasados, a.sla_atrasados > 0]]))); }
  if (t.desligamentos) { const d = t.desligamentos; g.push(grupo('Desligamentos', 'desligamentos', nums([['registrados no mês', d.registrados], ['pendentes de aprovação', d.pendentes_aprovacao, d.pendentes_aprovacao > 0]]))); }
  if (t.agente) { const a = t.agente; g.push(grupo('Agente integrador', 'agente', nums([['feedbacks no mês', a.feedbacks_no_mes], ['colaboradores em atraso', a.colaboradores_em_atraso, a.colaboradores_em_atraso > 0], ['marcos em atraso', a.marcos_em_atraso, a.marcos_em_atraso > 0]]))); }
  if (t.quadro || t.banco_horas) { const p = []; if (t.quadro) p.push(['vagas em aberto', t.quadro.vagas_abertas]); if (t.banco_horas) p.push(['banco de horas crítico', t.banco_horas.criticos, t.banco_horas.criticos > 0]); g.push(grupo('Quadro e jornada', null, nums(p))); }
  return g.length ? `<div class="grid g-grp">${g.join('')}</div>` : '<div class="card empty">Nenhum dado de trabalho disponível para o seu perfil.</div>';
}

function blocoMotivos(R) {
  const P = R.porMotivo; if (!P || !P.itens.length) return '';
  const max = P.itens[0].acoes || 1;
  const barras = P.itens.map(m => `<div class="mot"><div class="mot-h"><span>${esc(m.motivo)}</span><b>${nf(m.acoes)} ${m.acoes === 1 ? 'ação' : 'ações'} · ${nf(m.horas, 1)} h</b></div><div class="bar" role="img" aria-label="${esc(m.motivo)}: ${m.acoes}"><i style="width:${Math.max(3, Math.round(m.acoes / max * 100))}%"></i></div></div>`).join('');
  const resto = P.outros > 0 ? `<div class="sm">+ ${nf(P.outros)} ações em outros ${nf(P.distintos - P.itens.length)} tipos</div>` : '';
  return `<div class="card">${barras}${resto}</div>`;
}

function tabela(cols, linhas, vazio) {
  if (!linhas || !linhas.length) return `<div class="card empty">${esc(vazio)}</div>`;
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th>${esc(c[0])}</th>`).join('')}</tr></thead><tbody>${linhas.map(l => `<tr>${cols.map(c => `<td>${c[1](l)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

const chaveCli = x => String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase().replace(/\s*-\s*/g, '-').replace(/\s+/g, ' ').trim();
/** opções em cascata: diretoria -> regional -> coordenador */
function opsFiltro(R) {
  const O = R.opcoes || { diretorias: [], regionais: [], coordenadores: [] }, f = S.filtros, regs = O.regionais.filter(x => !f.diretoria || x.diretoria === f.diretoria);
  const regNomes = Array.from(new Set(regs.map(x => x.regional))), chaves = new Set(regNomes.map(chaveCli));
  let coords = O.coordenadores;
  const atende = (c, ks) => c.regionais.some(r => { const k = chaveCli(r); return k === 'TODAS' || ks.has(k); });
  if (f.regional) coords = coords.filter(c => atende(c, new Set([chaveCli(f.regional)])));
  else if (f.diretoria) coords = coords.filter(c => atende(c, chaves));
  return { dirs: O.diretorias, regs: regNomes, coords: coords };
}
function seletor(id, rotulo, todos, opcoes, atual) {
  if (opcoes.length < 2 && !atual) return '';
  return `<label for="${id}">${rotulo}<select id="${id}"><option value="">${todos}</option>${opcoes.map(o => `<option value="${esc(o[0])}"${o[0] === atual ? ' selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
}
function barraFiltros(R) {
  const o = opsFiltro(R), f = S.filtros;
  const h = seletor('fDir', 'Diretoria', 'Todas', o.dirs.map(x => [x, x]), f.diretoria) + seletor('fReg', 'Regional', 'Todas', o.regs.map(x => [x, x]), f.regional) + seletor('fCoord', 'Coordenador', 'Todos', o.coords.map(c => [c.email, c.nome]), f.coordenador);
  if (!h) return '';
  const ativo = f.diretoria || f.regional || f.coordenador;
  return `<div class="filt ctls" role="group" aria-label="Filtros">${h}${ativo ? '<button class="lnk" id="limpar">Limpar filtros</button>' : ''}</div>`;
}
function aplicarFiltro(campo, valor) {
  S.filtros[campo] = valor; const o = opsFiltro(S.R);
  if (S.filtros.regional && !o.regs.includes(S.filtros.regional)) S.filtros.regional = '';
  const o2 = opsFiltro(S.R); if (S.filtros.coordenador && !o2.coords.some(c => c.email === S.filtros.coordenador)) S.filtros.coordenador = '';
  S.fil.q = ''; S.fil.lim = 100; track('filtro', campo + '=' + valor); carregarVisao(S.comp);
}

function renderVisao(r) {
  const R = r.resumo, mesTxt = fmtMes(R.competencia); S.comp = R.competencia; S.R = R;
  const escopo = R.escopo.global ? `Rede inteira · ${nf(R.escopo.filiais)} filiais` : `${R.escopo.filtrado ? 'Recorte: ' : ''}${R.escopo.regionais.map(esc).join(', ') || 'nenhuma regional'} · ${nf(R.escopo.filiais)} filiais`;
  const optsMes = R.competencias.map(m => `<option value="${esc(m)}"${m === R.competencia ? ' selected' : ''}>${esc(fmtMes(m))}</option>`).join('');
  let h = `<div class="toolbar"><div><h1>Visão Geral</h1><span class="chip">${escopo}</span></div><div class="ctl"><label for="mes" class="sub">Mês</label><select id="mes" aria-label="Mês de referência">${optsMes}</select><button class="btn" id="atualizar">Atualizar</button></div></div>`;
  h += barraFiltros(R);
  if (R.indicadores) h += `<section><h2>Indicadores de ${esc(mesTxt)}</h2>${blocoIndicadores(R, mesTxt)}</section>`;
  h += `<section><h2>Trabalho realizado em ${esc(mesTxt)}</h2>${blocoTrabalho(R.trabalho || {})}</section>`;
  if (R.porMotivo && R.porMotivo.itens.length) h += `<section><h2>Ações por tipo em ${esc(mesTxt)}</h2>${blocoMotivos(R)}</section>`;
  if (R.porRegional && R.porRegional.length > 1) h += `<section><h2>Trabalho por regional</h2>${tabela([['Regional', l => esc(l.regional)], ['Filiais', l => nf(l.filiais)], ['Ações', l => nf(l.acoes)], ['Visitas', l => nf(l.visitas)]], R.porRegional, 'Sem dados por regional.')}</section>`;
  if (R.indicadores && R.indicadores.porFilial.length) h += `<section><h2>Indicadores por filial</h2><div class="ctls"><input id="busca" type="search" placeholder="Buscar filial, loja ou regional…" aria-label="Buscar filial" value="${esc(S.fil.q)}"><span class="sm" id="filCount"></span></div><div id="tblFil"></div></section>`;
  if (R.porCoordenador && R.porCoordenador.length) h += `<section><h2>Por coordenador</h2>${tabela([['Coordenador', l => esc(l.nome)], ['Ações', l => nf(l.acoes)], ['Visitas', l => nf(l.visitas)], ['Horas', l => nf(l.horas, 1)], ['Km', l => nf(l.km)]], R.porCoordenador, 'Nenhuma ação lançada no mês.')}</section>`;
  $('main').innerHTML = h;
  $('mes').onchange = e => { track('mudar mês', e.target.value); carregarVisao(e.target.value); };
  $('atualizar').onclick = () => { track('atualizar'); carregarVisao(S.comp); };
  if ($('fDir')) $('fDir').onchange = e => aplicarFiltro('diretoria', e.target.value);
  if ($('fReg')) $('fReg').onchange = e => aplicarFiltro('regional', e.target.value);
  if ($('fCoord')) $('fCoord').onchange = e => aplicarFiltro('coordenador', e.target.value);
  if ($('limpar')) $('limpar').onclick = () => { S.filtros = { diretoria: '', regional: '', coordenador: '' }; track('limpar filtros'); carregarVisao(S.comp); };
  if ($('busca')) $('busca').oninput = e => { clearTimeout(S.tb); S.tb = setTimeout(() => { S.fil.q = e.target.value; S.fil.lim = 100; renderFiliais(); }, 150); };
  renderFiliais();
}

async function carregarVisao(comp) {
  if (S.R && $('main').children.length) $('main').classList.add('busy'); else skeleton();
  try {
    const r = await call('obterVisaoGeral', comp || '', S.filtros); $('main').classList.remove('busy');
    if (!r.sucesso) return erro(r.acessoNegado ? 'Acesso não autorizado' : 'Erro ao carregar', r.erro);
    renderVisao(r);
  } catch (e) { $('main').classList.remove('busy'); erro('Erro de comunicação com o servidor', e.message || e); }
}

/* ---------- demais páginas (em construção, já com a API real) ---------- */
async function carregarGenerica(id) {
  skeleton(); const t0 = performance.now();
  try {
    const r = await call('obterDadosPagina', id); if (!r.sucesso) return erro(r.acessoNegado ? 'Acesso não autorizado' : 'Erro ao carregar', r.erro);
    const nomes = Object.keys(r.tabelas);
    $('main').innerHTML = `<div class="toolbar"><div><h1>${esc(r.titulo)}</h1><span class="chip">${r.contexto.global ? 'Rede inteira' : esc(r.contexto.regionais.join(', '))}</span></div></div>
      <div class="note">Página em construção. Os dados abaixo já chegam filtrados pela sua regional (${((performance.now() - t0) / 1000).toFixed(1)} s).</div>
      ${tabela([['Tabela', l => esc(l[0])], ['Linhas visíveis para você', l => nf(l[1])]], nomes.map(n => [n, r.tabelas[n].length]), 'Sem tabelas.')}`;
  } catch (e) { erro('Erro de comunicação com o servidor', e.message || e); }
}

document.addEventListener('click', e => {
  const th = e.target.closest('#tblFil th.s'); if (th) { const k = th.dataset.k; S.fil.asc = S.fil.k === k ? !S.fil.asc : true; S.fil.k = k; track('ordenar filiais', k); return renderFiliais(); }
  if (e.target.closest('#mais')) { S.fil.lim += 100; renderFiliais(); }
});

/* ---------- boot ---------- */
async function boot() {
  skeleton();
  try {
    const r = await call('obterContexto'); if (!r.sucesso) return erro(r.acessoNegado ? 'Acesso não autorizado' : 'Erro ao carregar', r.erro);
    S.ctx = r.contexto; if (!S.ctx.paginas.length) return erro('Sem páginas liberadas', 'Seu perfil ainda não tem páginas habilitadas. Procure o GP.');
    montarNav(); rota();
  } catch (e) { erro('Erro de comunicação com o servidor', e.message || e); }
}
boot();
</script>
